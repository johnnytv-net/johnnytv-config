    if (!playable) {
      const tag = el("div", "tag");
      tag.textContent = ext.toUpperCase();
      tag.title = "This format only plays in the app";
      row.appendChild(tag);
    }

    row.onclick = () => {
      const label = seriesState.name + "  \u00b7  S" + seriesState.season +
                    "E" + (e.episode_num || idx + 1);
      if (!playable) {
        setSplit(false);
        resetPlayerChrome();
        $("playerTitle").textContent = label;
        $("player").classList.remove("hidden");
        if (!pushedPlayer) pushedPlayer = pushScreen("player");
        stopPlayback();
        return playerMessage(
          '<div class="msg bad"><h3>This episode needs the app</h3>' +
          "<p>It is a <b>" + escapeHtml(ext.toUpperCase()) + "</b> file, and browsers have no " +
          "decoder for those. It plays fine in the Android app.</p></div>"
        );
      }
      play(episodeUrl(e.id, ext), label, false);
    };
    box.appendChild(row);
  });
}

/**
 * Turn an hls.js failure into something a person can act on, with the raw
 * detail underneath so it can be read out or screenshotted.
 */
/**
 * Ask the portal about a stream without swallowing it.
 *
 * A live .ts feed never ends, so the body is only read when we actually want
 * it (a playlist); otherwise the request is cut as soon as the status is known.
 */
async function probe(url, readBody) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 10000);
  try {
    const r = await fetch(url, { cache: "no-store", signal: ctrl.signal });
    let head = "";
    if (readBody && r.ok) head = (await r.text()).slice(0, 400);
    else try { ctrl.abort(); } catch (e) {}
    clearTimeout(timer);
    return { blocked: false, status: r.status, ok: r.ok, head: head };
  } catch (e) {
    clearTimeout(timer);
    return { blocked: true, status: 0, ok: false, head: "" };
  }
}

/**
 * Live playback.
 *
 * Portals differ in what they hand a browser, and a stalled one gives no signal
 * at all - it simply never sends video. So each way of playing a channel runs
 * under its own clock, and when a clock runs out the next way is tried rather
 * than leaving a spinner turning forever.
 *
 * HLS goes first where the portal offers it, because browsers handle it best.
 * The raw MPEG-TS feed - the one the Android app plays - is the fallback, and
 * on portals that refuse HLS it is the only route.
 */
const ATTEMPT_MS = 14000;

/**
 * How much to hold back before playing.
 *
 * More buffer means a slower start but far more tolerance for a portal that
 * delivers in fits and starts; less means the picture appears sooner. Which is
 * right depends on the connection, so it is a setting rather than a guess.
 */
const BUFFERS = {
  low:    { label: "Low",    stashKb: 256,  hlsSeconds: 20,  grace: 4000 },
  normal: { label: "Normal", stashKb: 1024, hlsSeconds: 40,  grace: 6000 },
  high:   { label: "High",   stashKb: 4096, hlsSeconds: 120, grace: 9000 }
};
const bufferSetting = () => BUFFERS[state.buffer] || BUFFERS.normal;
const STALL_TICK_MS = 1000;
const STALL_LIMIT_MS = 8000;
const MAX_RECONNECTS = 6;

/**
 * Keep a live pane alive.
 *
 * A live feed has no end, but a browser only knows about the seconds it has
 * actually been given: when the portal stops sending, the video reaches the
 * end of its buffer and simply stops, showing a countdown as if it were a short
 * file. Neither engine reports this. So the playhead is watched directly, and a
 * picture that stops moving - or a stream that "ends" - is put back on.
 */
function keepAlive(pn, token, onDrop) {
  const v = pn.v;
  let last = -1, stuck = 0, alive = 0;
  const grace = bufferSetting().grace;

  /*
   * A live feed that catches up with what has arrived makes the browser fire
   * "ended", exactly as if it were a short file that finished. Nearly always
   * more video is seconds away, so nudge it back into playing and let the stall
   * clock below decide - reconnecting on the spot produces a player that spends
   * its life reconnecting.
   */
  const onEnded = () => {
    if (token !== pn.token) return;
    v.play().catch(() => {});
  };
  v.addEventListener("ended", onEnded);

  const timer = setInterval(() => {
    if (token !== pn.token || $("player").classList.contains("hidden")) return stop();
    alive += STALL_TICK_MS;
    if (v.seeking) { last = v.currentTime; stuck = 0; return; }
    if (v.paused && !v.ended) { last = v.currentTime; stuck = 0; return; }

    if (last >= 0 && Math.abs(v.currentTime - last) < 0.05) {
      stuck += STALL_TICK_MS;
      // A stream that has run dry needs prodding as well as timing.
      if (v.ended || v.readyState < 3) v.play().catch(() => {});
    } else {
      stuck = 0;
      pn.settledFor = (pn.settledFor || 0) + STALL_TICK_MS;
    }
    last = v.currentTime;
    // Never give up inside the first few seconds - that is just the buffer filling.
    if (stuck >= STALL_LIMIT_MS && alive > grace) trigger();
  }, STALL_TICK_MS);

  function stop() { clearInterval(timer); v.removeEventListener("ended", onEnded); }
  function trigger() { stop(); onDrop(); }
  return stop;
}

/** Put the same channel back on in the same pane, leaving the other alone. */
function reconnectPane(pn) {
  if (!pn.channelId) return;
  // A channel that has been playing happily for a while has earned a fresh
  // allowance; one failing over and over has not.
  if ((pn.settledFor || 0) > 45000) pn.retries = 0;
  pn.retries = (pn.retries || 0) + 1;
  if (pn.retries > MAX_RECONNECTS) {
    return paneMessage(pn,
      '<div class="msg bad"><h3>This channel keeps dropping</h3>' +
      "<p>It has stopped sending several times in a row. It may be off air, or your line " +
      "may be at its connection limit - two panes use two connections.</p></div>");
  }
  const id = pn.channelId, title = pn.title;
  // Back off a little further each time, so a struggling feed gets room rather
  // than a barrage of reconnections.
  const wait = Math.min(1200 * pn.retries, 6000);
  paneMessage(pn, '<div class="msg"><b>Reconnecting</b> &mdash; the feed stopped sending.</div>');
  setTimeout(() => {
    if (!$("player").classList.contains("hidden") && pn.channelId === id) playLive(id, title, pn);
  }, wait);
}

async function playLive(streamId, title, into) {
  const pn = into || pane();
  const token = ++pn.token;
  // Whatever was on before this, so one key flips back to it - the thing every
  // remote has had since the eighties and almost no web player does.
  if (pn.channelId && String(pn.channelId) !== String(streamId)) {
    lastChannel = { id: String(pn.channelId), title: pn.title };
  }
  pn.isLive = true;
  if (pn.channelId !== String(streamId)) { pn.retries = 0; }
  pn.settledFor = 0;
  pn.channelId = String(streamId);
  pn.title = title;
  applyMutes();
  renderPaneBar(pn);
  $("chanToggle").classList.remove("hidden");
  $("bufferToggle").classList.remove("hidden");
  renderBufferButton();
  // Two panes need two connections. On a line that allows one they only take
  // turns stealing it from each other, so the option is not offered at all.
  $("splitToggle").classList.toggle("hidden", state.maxConnections === 1);
  if (typeof renderCastButton === "function") { renderCastButton(); refreshTvStatus(); }
  $("splitToggle").title = "Watch two channels side by side";
  if (pn.i === activePane) {
    $("playerTitle").textContent = title;
    showNowNext(pn);
  }
  $("player").classList.remove("hidden");
  if (!pushedPlayer) pushedPlayer = pushScreen("player");
  paneMessage(pn, '<span class="spinner"></span>');
  stopPane(pn);

  const creds = enc(state.username) + "/" + enc(state.password) + "/" + streamId;
  const base = state.server + "/live/" + creds;
  const legacy = state.server + "/" + creds;
  const tried = [];

  // The playlist is a small text file, so it is safe to read. The raw feed is
  // not - it never ends - so those are attempted rather than inspected.
  const hlsUrl = base + ".m3u8";
  const m = await probe(hlsUrl, true);
  if (token !== pn.token) return;
  tried.push("m3u8:" + (m.blocked ? "blocked" : m.status));
  if (m.blocked) {
    // Being refused the playlist as data says nothing about whether the browser
    // could play it directly. On Safari it still might, so try before giving up.
    return runAttempt(pn, [{ how: "native", url: hlsUrl }], 0, token, tried, probeBlockedHtml(hlsUrl));
  }

  const attempts = [];
  if (m.ok && m.head.indexOf("#EXTM3U") !== -1) {
    attempts.push({ how: "hls", url: hlsUrl });
    attempts.push({ how: "native", url: hlsUrl });
  }
  attempts.push({ how: "ts", url: base + ".ts" });
  attempts.push({ how: "ts", url: legacy });

  runAttempt(pn, attempts, 0, token, tried);
}

function runAttempt(pn, attempts, i, token, tried, finalHtml) {
  if (token !== pn.token) return;
  if (i >= attempts.length) return paneMessage(pn, finalHtml || giveUpHtml(tried));

  const next = () => runAttempt(pn, attempts, i + 1, token, tried, finalHtml);
  const a = attempts[i];
  if (a.how === "hls") startHls(pn, a.url, token, tried, next);
  else if (a.how === "native") startNative(pn, a.url, token, tried, next);
  else startTs(pn, a.url, token, tried, next);
}

/**
 * Hand the playlist straight to the video element.
 *
 * Safari plays HLS itself, and a video element loading a URL is NOT subject to
 * the cross-origin rule that governs fetch. So a portal that blocks the page
 * from reading its streams may still play here, where it cannot anywhere else.
 * Chrome and Firefox have no native HLS, so this is Safari's route alone.
 */
function startNative(pn, url, token, tried, onFail) {
  const v = pn.v;
  if (!v.canPlayType("application/vnd.apple.mpegurl")) { tried.push("native:unsupported"); return onFail(); }

  let done = false, onPlaying = null;
  const finish = (ok, note) => {
    if (done) return;
    done = true;
    stopClock();
    if (onPlaying) v.removeEventListener("playing", onPlaying);
    if (ok) { paneMessage(pn, ""); return; }
    tried.push("native:" + note);
    onFail();
  };
  const stopClock = watchdog(pn, token, ATTEMPT_MS, () => finish(false, "no-video"));

  v.onerror = () => finish(false, "error" + ((v.error && v.error.code) || ""));
  onPlaying = () => finish(true);
  v.addEventListener("playing", onPlaying, { once: true });
  v.src = url;
  v.play().catch(() => {});
}

function giveUpHtml(tried) {
  // On a one-connection line this is nearly always the television in the other
  // room, not a broken channel. Saying so first turns a support call into
  // something the customer can fix in ten seconds.
  if (state.maxConnections === 1) {
    return '<div class="msg bad"><h3>You are already watching somewhere else</h3>' +
      "<p>Your service allows one screen at a time, and something else is using it - " +
      "usually the TV box. Close JohnnyTV there, wait a few seconds, and press play again.</p>" +
      "<p>If nothing else is on, the channel itself may be off air. Try another one to tell " +
      "the difference.</p>" +
      '<p style="color:#8b949e;font-size:12px">' + escapeHtml(tried.join("  ")) + "</p></div>";
  }
  return '<div class="msg bad"><h3>This channel would not play</h3>' +
    "<p>Nothing the portal offered for this channel would run in a browser. It may be off " +
    "air, or your line may already be at its connection limit - close the app on your other " +
    "devices and try again.</p>" +
    '<p style="color:#8b949e;font-size:12px">' + escapeHtml(tried.join("  ")) + "</p></div>";
}

/** Every attempt gets a clock; a portal that stalls never reports anything itself. */
function watchdog(pn, token, ms, onTimeout) {
  const t = setTimeout(() => {
    if (token !== pn.token) return;
    if ($("player").classList.contains("hidden")) return;
    onTimeout();
  }, ms);
  return () => clearTimeout(t);
}

function startHls(pn, url, token, tried, onFail) {
  const v = pn.v;
  if (!(window.Hls && Hls.isSupported())) {
    // Safari plays HLS natively; everything else needs the library, and without
    // it there is no point waiting.
    if (!v.canPlayType("application/vnd.apple.mpegurl")) { tried.push("hls:unsupported"); return onFail(); }
    v.src = url;
    v.play().catch(() => {});
    const stopNative = watchdog(pn, token, ATTEMPT_MS, () => { tried.push("hls:native-timeout"); onFail(); });
    v.addEventListener("playing", () => { stopNative(); paneMessage(pn, ""); }, { once: true });
    return;
  }

  let netTries = 0, mediaTries = 0, done = false, playing = false;
  const mine = new Hls({
    lowLatencyMode: false,
    backBufferLength: 30,
    maxBufferLength: bufferSetting().hlsSeconds,
    maxMaxBufferLength: bufferSetting().hlsSeconds * 2,
    manifestLoadingTimeOut: 10000
  });
  pn.hls = mine;

  const drop = () => {
    try { mine.destroy(); } catch (e) {}
    if (pn.hls === mine) pn.hls = null;
  };
  let stopAlive = null;
  const finish = (ok, note) => {
    if (done) return;
    done = true;
    stopClock();
    if (ok) {
      playing = true;
      paneMessage(pn, "");
      stopAlive = keepAlive(pn, token, () => { drop(); reconnectPane(pn); });
      return;
    }
    tried.push("hls:" + note);
    drop();
    onFail();
  };
  const stopClock = watchdog(pn, token, ATTEMPT_MS, () => finish(false, "no-video"));

  mine.on(Hls.Events.FRAG_BUFFERED, () => finish(true));
  mine.on(Hls.Events.ERROR, (_e, data) => {
    if (!data.fatal || token !== pn.token) return;
    if (data.type === Hls.ErrorTypes.NETWORK_ERROR && netTries < 1) { netTries++; mine.startLoad(); return; }
    if (data.type === Hls.ErrorTypes.MEDIA_ERROR && mediaTries < 1) { mediaTries++; mine.recoverMediaError(); return; }
    if (!done) return finish(false, data.details || "error");
    // A channel that played and then dropped deserves saying so rather than
    // freezing on the last frame it managed.
    if (playing) {
      playing = false;
      if (stopAlive) stopAlive();
      drop();
      reconnectPane(pn);
    }
  });
  mine.loadSource(url);
  mine.attachMedia(v);
  v.play().catch(() => {});
}

function startTs(pn, url, token, tried, onFail) {
  const v = pn.v;
  const label = url.indexOf(".ts") !== -1 ? "ts" : "plain";

  if (!(window.mpegts && mpegts.getFeatureList().mseLivePlayback)) {
    tried.push(label + ":unsupported");
    return paneMessage(pn, 
      '<div class="msg bad"><h3>This browser cannot play live channels</h3>' +
      "<p>Live TV here needs Media Source Extensions. Chrome, Edge and Firefox all have it; " +
      "Safari on iPhone does not.</p></div>"
    );
  }

  let done = false, playing = false, mine = null, onPlaying = null, stopAlive = null;
  const finish = (ok, note) => {
    if (done) return;
    done = true;
    stopClock();
    if (onPlaying) v.removeEventListener("playing", onPlaying);
    if (ok) {
      playing = true;
      paneMessage(pn, "");
      stopAlive = keepAlive(pn, token, () => {
        tearDownTs(mine);
        if (pn.ts === mine) pn.ts = null;
        reconnectPane(pn);
      });
      return;
    }
    tried.push(label + ":" + note);
    if (mine) {
      tearDownTs(mine);
      if (pn.ts === mine) pn.ts = null;
    }
    onFail();
  };
  const stopClock = watchdog(pn, token, ATTEMPT_MS, () => finish(false, "no-video"));

  // Tuned for a steady picture rather than a low delay - the same trade the
  // Android app makes. Latency chasing is off on purpose: skipping forward to
  // catch up with the live edge is what makes an IPTV feed stutter.
  mine = pn.ts = mpegts.createPlayer({ type: "mpegts", isLive: true, url: url }, {
    enableStashBuffer: true,
    // Halved on a split screen, where two streams are filling at once.
    stashInitialSize: splitOn ? Math.round(bufferSetting().stashKb / 2) : bufferSetting().stashKb,
    liveBufferLatencyChasing: false,
    lazyLoad: false,
    enableWorker: false,
    // Long sessions otherwise grow the buffer until the tab runs out of memory.
    autoCleanupSourceBuffer: true,
    autoCleanupMaxBackwardDuration: 60,
    autoCleanupMinBackwardDuration: 30
  });

  mine.on(mpegts.Events.MEDIA_INFO, (info) => {
    // Browsers demux more than they can decode. AC-3 and MPEG Layer II are the
    // usual culprits on channels sourced from satellite.
    const a = ((info && info.audioCodec) || "").toLowerCase();
    if (a.indexOf("ac-3") !== -1 || a.indexOf("ec-3") !== -1) {
      paneMessage(pn, 
        '<div class="msg bad"><h3>Picture only - no sound</h3>' +
        "<p>This channel's audio is in a format browsers cannot decode. The picture should " +
        "play. It has sound in the Android app.</p></div>"
      );
      setTimeout(() => { if (token === pn.token) paneMessage(pn, ""); }, 6000);
    }
  });
  mine.on(mpegts.Events.ERROR, (type, detail) => {
    if (token !== pn.token) return;
    if (!done) return finish(false, String(detail || type));
    if (!playing) return;
    // It played and then dropped. A codec fault will not improve on a retry;
    // anything else usually does.
    playing = false;
    if (stopAlive) stopAlive();
    tearDownTs(mine);
    if (pn.ts === mine) pn.ts = null;
    if (String(detail).indexOf("CODEC") !== -1) {
      return paneMessage(pn,
        '<div class="msg bad"><h3>This channel will not play here</h3>' +
        "<p>Its video or audio format has no decoder in this browser. It plays in the app.</p></div>");
    }
    reconnectPane(pn);
  });

  mine.attachMediaElement(v);
  mine.load();
  mine.play().catch(() => {});
  onPlaying = () => finish(true);
  v.addEventListener("playing", onPlaying, { once: true });
}

function probeBlockedHtml(url) {
  return '<div class="msg bad"><h3>The browser refused to read this stream</h3>' +
    "<p>This service lets the page read the channel list, but not the video. The stream " +
    "address needs the same permission the channel list already has - one header, " +
    "<code>Access-Control-Allow-Origin</code>, on the live stream path.</p>" +
    "<p>Films play because browsers fetch those a different way. Live channels do not get that exemption.</p>" +
    '<p style="color:#8b949e;font-size:12px">blocked by browser &middot; status 0 &middot; ' +
    escapeHtml(hostOf(url)) + "</p></div>";
}

function streamErrorHtml(data, url) {
  const status = (data.response && data.response.code) || 0;
  const detail = data.details || "unknown";
  let host = "";
  try { host = new URL(data.url || url).host; } catch (e) { host = "?"; }

  let headline = "This channel would not play";
  let body;

  if (status === 0) {
    body = "The browser refused to fetch the video. Your portal lets this page read the " +
           "channel list but is not allowing it to read the <b>video</b> - the stream address " +
           "needs the same permission the API already has." +
           (host && host !== hostOf(state.server)
              ? " Note the video is served from <code>" + escapeHtml(host) + "</code>, a different " +
                "address from the portal, so the permission is needed there."
              : "");
  } else if (status === 403) {
    headline = "The portal refused this stream";
    body = "That usually means the maximum number of connections for your line is already " +
           "in use. Close the app on your other devices and try again.";
  } else if (status === 404) {
    body = "The portal has no HLS version of this channel. Browsers cannot play the raw feed " +
           "the app uses, so a channel offered only as .ts will not work here.";
  } else if (detail.indexOf("Timeout") !== -1 || detail.indexOf("TimeOut") !== -1) {
    body = "The portal did not answer in time. It may be busy, or this channel may be down.";
  } else {
    body = "The stream failed to load.";
  }

  return '<div class="msg bad"><h3>' + headline + "</h3><p>" + body + "</p>" +
         '<p style="color:#8b949e;font-size:12px;margin-top:10px">' +
         escapeHtml(detail) + " &middot; status " + status + " &middot; " + escapeHtml(host) +
         "</p></div>";
}

function hostOf(u) { try { return new URL(u).host; } catch (e) { return ""; } }

/**
 * Turn the video element's own complaint into something readable.
 *
 * The browser knows exactly why it gave up - whether it never understood the
 * format, understood it but could not decode it, or lost the connection - and
 * those want different answers. Guessing helps nobody.
 */
function mediaErrorHtml(v, container, what) {
  const code = (v.error && v.error.code) || 0;
  let head, body;

  if (code === 4) {
    head = "This " + what + " is in a format browsers cannot play";
    body = "The portal labels it <b>" + escapeHtml(container.toUpperCase()) + "</b>, but the video or " +
           "audio inside is something browsers have no decoder for - H.265 video and AC-3 audio are the " +
           "usual culprits, and both are common on IPTV films.";
  } else if (code === 3) {
    head = "This " + what + " would not decode";
    body = "The browser started reading it and then failed part way in. That usually means the file " +
           "is damaged, or mislabelled by the portal.";
  } else if (code === 2) {
    head = "The connection dropped";
    body = "The portal stopped sending part way through. It may be busy, or your line may be at its " +
           "connection limit - close the app on your other devices and try again.";
  } else {
    head = "This " + what + " would not play";
    body = "The browser could not play it and did not say why.";
  }

  return '<div class="msg bad"><h3>' + head + "</h3><p>" + body + "</p>" +
    "<p>It should still play in the Android app, which carries its own decoders.</p>" +
    '<p style="color:#8b949e;font-size:12px">media error ' + code + " &middot; " +
    escapeHtml(container) + "</p></div>";
}

/**
 * Films. Unlike live channels these are ordinary files, so the video element
 * fetches them itself and CORS never enters into it - but the browser only
 * decodes a handful of formats, and the portal can still refuse the request.
 */
async function playFilm(item, title) {
  setSplit(false);
  const pn = panes[0];
  const token = ++pn.token;
  // Arrow keys seek inside a film; they only change channel on live TV.
  pn.isLive = false;
  resetPlayerChrome();
  const container = containerOf(item);
  const url = movieUrl(item.stream_id, container);

  $("playerTitle").textContent = title;
  $("player").classList.remove("hidden");
  if (!pushedPlayer) pushedPlayer = pushScreen("player");
  stopPlayback();

  if (!playableHere("vod", item)) {
    return playerMessage(
      '<div class="msg bad"><h3>This film needs the app</h3>' +
      "<p>It is a <b>" + escapeHtml(container.toUpperCase()) + "</b> file. Browsers can only play " +
      "MP4, and there is no way around that from a web page - the same film plays fine in the " +
      "Android app.</p><p>Films marked with a red tag in the corner are the ones this affects.</p></div>"
    );
  }

  playerMessage('<span class="spinner"></span>');

  const v = pn.v;
  const stopClock = watchdog(pn, token, ATTEMPT_MS, () => playerMessage(
    '<div class="msg bad"><h3>This film would not start</h3>' +
    "<p>The portal accepted the request and then sent nothing for fourteen seconds. " +
    "It may be busy, or your line may be at its connection limit.</p></div>"
  ));
  v.onloadeddata = () => { stopClock(); playerMessage(""); };
  v.onerror = () => { stopClock(); playerMessage(mediaErrorHtml(v, container, "film")); };
  v.src = url;
  v.play().catch(() => {});
}

function paneMessage(pn, html) {
  const box = pn.msg;
  if (!html) { box.classList.add("hidden"); box.innerHTML = ""; return; }
  box.classList.remove("hidden");
  box.innerHTML = '<div class="box">' + html + "</div>";
}

/** Films and series always use the first pane. */
function playerMessage(html) { paneMessage(panes[0], html); }

function play(url, title, isLive) {
  setSplit(false);
  panes[0].isLive = !!isLive;
  const pn = panes[0];
  const v = pn.v;
  resetPlayerChrome();
  $("playerTitle").textContent = title;
  $("player").classList.remove("hidden");
  if (!pushedPlayer) pushedPlayer = pushScreen("player");
  playerMessage('<span class="spinner"></span>');
  stopPlayback();

  const token = ++pn.token;
  const stopClock = watchdog(pn, token, ATTEMPT_MS, () => playerMessage(
    '<div class="msg bad"><h3>This would not play</h3>' +
    "<p>Nothing arrived within fourteen seconds. The episode may be in a format browsers " +
    "cannot decode - MKV especially - or the portal may not be serving it.</p>" +
    "<p>It should still play in the Android app.</p></div>"
  ));

  v.onloadeddata = () => { stopClock(); playerMessage(""); };
  v.onerror = () => {
    stopClock();
    const ext = (url.split(".").pop() || "").toLowerCase();
    playerMessage(mediaErrorHtml(v, ext, "episode"));
  };
  v.src = url;
  v.play().catch(() => { /* autoplay refusal - the controls are there */ });
}

function tearDownTs(player) {
  try { player.pause(); } catch (e) {}
  try { player.unload(); } catch (e) {}
  try { player.detachMediaElement(); } catch (e) {}
  try { player.destroy(); } catch (e) {}
}

function stopPane(pn) {
  const v = pn.v;
  // A film's handlers must not still be armed when a live channel fails, or the
  // viewer gets a message about MP4 films over a television channel.
  v.onerror = null;
  v.onloadeddata = null;
  if (pn.hls) { try { pn.hls.destroy(); } catch (e) {} pn.hls = null; }
  if (pn.ts) {
    // Leaving a player attached holds the HTTP pull open and blocks the next channel.
    tearDownTs(pn.ts);
    pn.ts = null;
  }
  v.removeAttribute("src");
  v.load();
}

function stopPlayback() { panes.forEach(stopPane); }

function closePlayer() {
  panes.forEach(p => p.token++);
  setSplit(false);
  resetPlayerChrome();
  stopPlayback();
  playerMessage("");
  $("player").classList.add("hidden");
}

/**
 * The bar across the top of each pane: which channel it is on, and what you can
 * do with it. Clicking the picture still just moves the sound - these are for
 * the two things you would otherwise have to leave the player to do.
 */
function renderPaneBar(pn) {
  const bar = pn.label;
  bar.innerHTML = "";
  bar.classList.toggle("hidden", !splitOn || !pn.title);
  if (!splitOn || !pn.title) return;

  const nm = el("div", "nm");
  nm.textContent = pn.title;
  bar.appendChild(nm);

  const acts = el("div", "acts");

  const change = el("button");
  change.textContent = "Change";
  change.title = "Pick a different channel for this screen";
  change.onclick = (e) => { e.stopPropagation(); setActivePane(pn.i); toggleChannels(true); };
  acts.appendChild(change);

  const close = el("button", "x");
  close.textContent = "\u2715";
  close.title = "Close this screen";
  close.onclick = (e) => { e.stopPropagation(); closePane(pn.i); };
  acts.appendChild(close);

  bar.appendChild(acts);
}

/**
 * Closing one half returns to a single screen showing the other half's channel,
 * whichever side was closed.
 */
function closePane(i) {
  const keep = panes[1 - i];
  const id = keep.channelId, title = keep.title;
  setSplit(false);
  if (i === 0 && id) {
    // The one they kept was on the right; bring it over to the full screen.
    playLive(id, title, panes[0]);
  } else if (i === 0) {
    closePlayer();
  }
}

/** Live TV brings a guide line and a channel button; nothing else does. */
function resetPlayerChrome() {
  panes.forEach(p => { p.channelId = ""; p.title = ""; p.label.innerHTML = ""; p.label.classList.add("hidden"); });
  $("chanToggle").classList.add("hidden");
  $("splitToggle").classList.add("hidden");
  $("bufferToggle").classList.add("hidden");
  $("nowNext").classList.add("hidden");
  toggleChannels(false);
}

/**
 * Split screen. The second pane only ever carries live TV, and only one pane
 * has sound - clicking a pane moves the sound to it, and the next channel you
 * pick loads into whichever pane is active.
 */
function setSplit(on) {
  if (on === splitOn && !on) return;
  splitOn = !!on;
  $("videoWrap").classList.toggle("split", splitOn);
  $("pane1").classList.toggle("hidden", !splitOn);
  $("splitToggle").textContent = splitOn ? "Single screen" : "Split screen";

  if (!splitOn) {
    const p1 = panes[1];
    p1.token++;
    stopPane(p1);
    paneMessage(p1, "");
    p1.channelId = ""; p1.title = "";
    activePane = 0;
  }
  panes.forEach(renderPaneBar);
  setActivePane(activePane);
}

/* =====================================================================
   CHANNEL LIST OVER THE VIDEO

   Coming out of the player to change channel is the thing that makes a web
   player feel worse than an app, so the list comes to the video instead.
   ===================================================================== */
function toggleChannels(force) {
  const panel = $("chanPanel");
  const open = force === undefined ? panel.classList.contains("hidden") : force;
  panel.classList.toggle("hidden", !open);
  if (open) { updateChanTarget(); renderChannelPanel(); return; }
  clearTimeout(chanTimer);
  chanObservers.forEach(o => { try { o.disconnect(); } catch (e) {} });
  chanObservers = [];
}

function channelPool() {
  // Whatever the viewer was looking at when they started watching, so the list
  // matches the category they chose rather than all 3,000 channels.
  const q = ($("chanSearch").value || "").trim().toLowerCase();
  let list = state.live;
  if (state.kind === "live" && state.catId && state.catId !== "__all") {
    if (state.catId === "__fav") list = list.filter(x => isFav("live", itemId("live", x)));
    else list = list.filter(x => itemCat(x) === state.catId);
  }
  if (q) list = list.filter(x => nameMatches(itemName("live", x), q));
  return list;
}

let chanObservers = [];

function renderChannelPanel() {
  const box = $("chanList");
  // Each row carries an observer waiting to fetch its guide entry; rebuilding
  // the list without dropping them leaks one per row, every keystroke.
  chanObservers.forEach(o => { try { o.disconnect(); } catch (e) {} });
  chanObservers = [];
  box.innerHTML = "";
  const list = channelPool().slice(0, 400);
  if (!list.length) { box.innerHTML = '<div id="empty">No channels here.</div>'; return; }

  list.forEach(x => {
    const id = itemId("live", x);
    const onAir = panes.some(p => p.channelId === id);
    const row = el("div", "chanRow" + (onAir ? " playing" : ""));

    const img = el("img");
    img.loading = "lazy";
    img.src = itemArt("live", x) || CONFIG.PLACEHOLDER;
    img.onerror = () => { img.onerror = null; img.src = CONFIG.PLACEHOLDER; };
    row.appendChild(img);

    const txt = el("div", "txt");
    const nm = el("b"); nm.textContent = itemName("live", x); txt.appendChild(nm);
    const on = el("span"); on.textContent = ""; txt.appendChild(on);
    row.appendChild(txt);

    // The guide is fetched per channel, so only ask for rows actually on screen.
    onceVisible(row, () => nowNext(id).then(rows => {
      if (rows[0]) on.textContent = hhmm(rows[0].start) + "  " + rows[0].title;
    }));

    row.onclick = () => {
      toggleChannels(false);
      // Already on this one - reconnecting would only interrupt it.
      if (pane().channelId === id) return;
      playLive(id, itemName("live", x), pane());
    };
    box.appendChild(row);
  });
}

/** Run something the first time an element scrolls into view. */
/**
 * Runs [fn] the first time [node] scrolls into view inside [rootId] - the box
 * it actually scrolls in. Naming the wrong box means the callback never fires
 * at all, so the caller always says which one.
 */
function onceVisible(node, fn, rootId) {
  if (!("IntersectionObserver" in window)) { fn(); return; }
  const io = new IntersectionObserver(entries => {
    entries.forEach(en => { if (en.isIntersecting) { io.disconnect(); fn(); } });
  }, { root: $(rootId || "chanList"), rootMargin: "120px" });
  io.observe(node);
  chanObservers.push(io);
}

/* ---------- what is on now ---------- */
async function showNowNext(pn) {
  const box = $("nowNext");
  const streamId = pn.channelId;
  box.classList.add("hidden");
  if (!streamId) return;
  const rows = await nowNext(streamId);
  if (pn.channelId !== streamId || pn.i !== activePane || !rows.length) return;

  const now = rows[0], next = rows[1];
  let html = "<b>" + escapeHtml(now.title) + "</b>";
  if (now.start && now.end) html += "  " + hhmm(now.start) + " - " + hhmm(now.end);
  if (next) html += '<span style="opacity:.75">  &nbsp;then ' + escapeHtml(next.title) + "</span>";

  if (now.start && now.end && now.end > now.start) {
    const pct = Math.max(0, Math.min(100, ((Date.now() - now.start) / (now.end - now.start)) * 100));
    html += '<div class="bar"><i style="width:' + pct.toFixed(1) + '%"></i></div>';
  }
  box.innerHTML = html;
  box.classList.remove("hidden");
}

/* =====================================================================
   CATCH-UP

   Portals keep a few days of some channels on disk - usually sport and the
   international ones, rarely everything. Each channel says for itself whether
   it has an archive and how far back it goes, so this screen is built entirely
   from what the portal admits to: channels without one never appear, and there
   is nothing for anyone to learn or be told.

   Three steps on one screen - channel, day, programme - because that is the
   order people think in, and because Back should walk them rather than throw
   you out.
   ===================================================================== */

let cuStep = 0, cuChannel = null, cuDay = null, cuPushed = false, cuToken = 0;

/** Channels the portal says it keeps a recording of. */
function archiveChannels() {
  return (state.live || []).filter(c => Number(c.tv_archive) === 1);
}

/** How many days back this channel goes, with a sane floor and ceiling. */
function archiveDays(ch) {
  const d = Number(ch && ch.tv_archive_duration) || 0;
  return Math.max(1, Math.min(14, d || 7));
}

function openCatchup() {
  cuStep = 0; cuChannel = null; cuDay = null;
  show("catchupScreen");
  if (!cuPushed) cuPushed = pushScreen("catchupScreen");
  renderCatchup();
}

function closeCatchup() { cuPushed = false; openHome(); }

function catchupBack() {
  if (cuStep === 2) { cuStep = 1; cuDay = null; return renderCatchup(); }
  if (cuStep === 1) { cuStep = 0; cuChannel = null; return renderCatchup(); }
  closeCatchup();
}

function cuRow(main, meta, onClick, logo) {
  const row = document.createElement("div");
  row.className = "curow";
  if (logo) {
    const img = document.createElement("img");
    img.loading = "lazy"; img.alt = "";
    img.src = logo;
    img.onerror = () => { img.style.visibility = "hidden"; };
    row.appendChild(img);
  }
  const name = document.createElement("div");
  name.className = "cuname";
  name.textContent = main;
  row.appendChild(name);
  if (meta) {
    const m = document.createElement("div");
    m.className = "cumeta";
    m.textContent = meta;
    row.appendChild(m);
  }
  row.onclick = onClick;
  return row;
}

function renderCatchup() {
  const body = $("cuBody");
  body.innerHTML = "";
  const token = ++cuToken;
  // The search box only means anything on the list of channels.
  $("cuSearch").classList.toggle("hidden", cuStep !== 0);

  if (cuStep === 0) {
    $("cuTitle").textContent = "Catch-up";
    const q = ($("cuSearch").value || "").trim().toLowerCase();
    const list = archiveChannels().filter(c => !q || itemName("live", c).toLowerCase().indexOf(q) !== -1);
    $("cuSub").textContent = list.length
      ? list.length + (list.length === 1 ? " channel" : " channels")
      : "";
    if (!list.length) {
      body.innerHTML = '<div class="note"><b>No channels on this service keep a recording.</b><br>' +
        "Catch-up is switched on per channel by whoever runs the service, not here. " +
        "If you think it should be available, that is a question for them.</div>";
      return;
    }
    list.forEach(ch => {
      body.appendChild(cuRow(
        itemName("live", ch),
        archiveDays(ch) + " days",
        () => { cuChannel = ch; cuStep = 1; renderCatchup(); },
        logoFor(itemId("live", ch), itemName("live", ch), ch.stream_icon || "")
      ));
    });
    return;
  }

  if (cuStep === 1) {
    $("cuTitle").textContent = itemName("live", cuChannel);
    $("cuSub").textContent = "Pick a day";
    const days = archiveDays(cuChannel);
    const now = new Date();
    for (let i = 0; i < days; i++) {
      const d = new Date(now.getFullYear(), now.getMonth(), now.getDate() - i);
      const label = i === 0 ? "Today" : i === 1 ? "Yesterday"
        : d.toLocaleDateString([], { weekday: "long" });
      const meta = d.toLocaleDateString([], { day: "numeric", month: "short" });
      body.appendChild(cuRow(label, meta, () => { cuDay = d; cuStep = 2; renderCatchup(); }));
    }
    return;
  }

  // Programmes for one channel on one day, past only - there is no recording of
  // something that has not happened yet.
  $("cuTitle").textContent = itemName("live", cuChannel);
  $("cuSub").textContent = cuDay.toLocaleDateString([], { weekday: "long", day: "numeric", month: "short" });
  body.innerHTML = '<div class="note"><span class="spinner"></span></div>';

  catchupListings(cuChannel).then(all => {
    if (token !== cuToken) return;
    const from = new Date(cuDay.getFullYear(), cuDay.getMonth(), cuDay.getDate()).getTime();
    const to = from + 24 * 3600 * 1000;
    const now = Date.now();
    const rows = all
      .filter(p => p.start >= from && p.start < to && p.start < now)
      .sort((a, b) => a.start - b.start);

    body.innerHTML = "";
    if (!rows.length) {
      body.innerHTML = '<div class="note">No listings for this day. The portal keeps the recording ' +
        "and the guide separately, so a day can be recorded without anything to show here.</div>";
      return;
    }
    rows.forEach(p => {
      const when = new Date(p.start).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
      body.appendChild(cuRow(p.title, when + "  " + p.mins + " min", () => playArchive(cuChannel, p)));
    });
  }).catch(() => {
    if (token !== cuToken) return;
    body.innerHTML = '<div class="note">Could not read the listings for this channel.</div>';
  });
}

/**
 * The fuller schedule - get_short_epg only looks forward, and catch-up is
 * entirely about looking back.
 */
async function catchupListings(ch) {
  const id = itemId("live", ch);
  const data = await api({ action: "get_simple_data_table", stream_id: id }, API_TIMEOUT_FAST_MS);
  const list = (data && data.epg_listings) || [];
  learnPortalOffset(list);
  return list.map(e => {
    const start = Number(e.start_timestamp) * 1000 || portalTime(e.start);
    const end = Number(e.stop_timestamp) * 1000 || portalTime(e.end);
    // The portal's own written time, reused verbatim - the archive address is
    // in portal time, and handing its own string back cannot drift.
    const written = String(e.start || "").trim().replace(" ", ":").slice(0, 16).replace(/:(\d\d)$/, "-$1");
    return {
      title: epgText(e.title),
      desc: epgText(e.description),
      start: start,
      end: end,
      startStr: written,
      mins: Math.max(1, Math.round((end - start) / 60000) || 30)
    };
  }).filter(p => p.title && p.start && p.startStr.length === 16);
}

/**
 * Panels disagree about how an archive is addressed, exactly as they disagree
 * about live streams. So the same approach is used: offer every shape in turn
 * and keep the first that plays.
 */
function archiveAttempts(ch, p) {
  const id = itemId("live", ch);
  const creds = enc(state.username) + "/" + enc(state.password);
  const a = state.server + "/timeshift/" + creds + "/" + p.mins + "/" + p.startStr + "/" + id;
  const b = state.server + "/streaming/timeshift.php?username=" + enc(state.username) +
            "&password=" + enc(state.password) + "&stream=" + id +
            "&start=" + encodeURIComponent(p.startStr) + "&duration=" + p.mins;
  return [
    { how: "ts", url: a + ".ts" },
    { how: "hls", url: a + ".m3u8" },
    { how: "native", url: a + ".m3u8" },
    { how: "ts", url: b }
  ];
}

function archiveFailHtml() {
  return '<div class="msg bad"><h3>This recording would not play</h3>' +
    "<p>The channel says it keeps an archive, but nothing the portal offered for this " +
    "programme would run in a browser. Either the recording is not there, or it is in a " +
    "format only the app can play.</p>" +
    "<p>Live TV on this channel is unaffected.</p></div>";
}

function playArchive(ch, p) {
  setSplit(false);
  const pn = panes[0];
  const token = ++pn.token;
  pn.isLive = false;
  pn.channelId = null;
  resetPlayerChrome();
  $("playerTitle").textContent = p.title + "  -  " + itemName("live", ch);
  $("player").classList.remove("hidden");
  if (!pushedPlayer) pushedPlayer = pushScreen("player");
  stopPlayback();
  paneMessage(pn, '<span class="spinner"></span>');
  runAttempt(pn, archiveAttempts(ch, p), 0, token, [], archiveFailHtml());
}

/*
 * Screen history.
 *
 * People reach for the browser's back arrow before they look for a button on
 * the page, and without this that walks them off the site altogether. Each
 * screen pushes an entry, and going back unwinds one screen at a time.
 */
let pushedPlayer = false, pushedBrowse = false;

function pushScreen(name) {
  try { history.pushState({ jtv: name }, ""); return true; } catch (e) { return false; }
}

window.addEventListener("popstate", () => {
  if (!$("player").classList.contains("hidden")) { pushedPlayer = false; closePlayer(); return; }
  if (!$("guideScreen").classList.contains("hidden")) { closeGuide(); return; }
  if (!$("catchupScreen").classList.contains("hidden")) { cuPushed = false; openHome(); return; }
  if (!$("seriesScreen").classList.contains("hidden")) { pushedSeries = false; show("browse"); return; }
  if (!$("browse").classList.contains("hidden")) { pushedBrowse = false; openHome(); }
});

function goBackFromPlayer() {
  if (pushedPlayer) { pushedPlayer = false; history.back(); } else closePlayer();
}

function goBackFromBrowse() {
  if (pushedBrowse) { pushedBrowse = false; history.back(); } else openHome();
}

document.addEventListener("fullscreenchange", () => {
  const fs = document.fullscreenElement;
  if (!splitOn || !fs) return;
  const p = panes.find(x => x.v === fs);
  if (p) setActivePane(p.i);
});


/* =====================================================================
   CHANNEL CONTROL - the set-top-box habits people already have

   A television has three controls this player did not: channel up, channel
   down, and "take me back to what I was just watching". They cost nothing to
   add and they are the difference between a web page that plays television
   and something that feels like a television.

   Numbers work the way they do on a remote: type 4, 0, 2 and it waits a beat
   in case a fourth digit is coming, then goes there.
   ===================================================================== */

let lastChannel = null;
let zapBuffer = "", zapTimer = null;

/** True only when the front pane is showing live TV, not a film or an episode. */
function zappable() {
  const pn = pane();
  return !!(pn && pn.isLive && pn.channelId);
}

/**
 * The list channel up/down walks.
 *
 * Deliberately the category the viewer is in rather than all three thousand
 * channels - paging through Sports should stay in Sports, the way a proper box
 * behaves once you have picked a group.
 */
function zapList() {
  const pool = channelPool();
  return pool.length ? pool : (state.live || []);
}

function zapToast(text) {
  let el = document.getElementById("zapToast");
  if (!el) {
    el = document.createElement("div");
    el.id = "zapToast";
    el.style.cssText =
      "position:absolute;top:18px;right:18px;z-index:40;background:rgba(8,11,15,.92);" +
      "border:1px solid rgba(46,125,247,.55);border-radius:10px;padding:8px 16px;" +
      "color:#f2f5f8;font-size:24px;font-weight:700;letter-spacing:1px;" +
      "font-variant-numeric:tabular-nums;pointer-events:none";
    ($("videoWrap") || $("player") || document.body).appendChild(el);
  }
  el.textContent = text;
  el.style.display = "block";
  clearTimeout(el._hide);
  el._hide = setTimeout(() => { el.style.display = "none"; }, 1600);
}

function zapByOffset(step) {
  if (!zappable()) return;
  const pn = pane();
  const list = zapList();
  if (!list.length) return;
  const at = list.findIndex(x => itemId("live", x) === String(pn.channelId));
  if (at === -1) return;
  const next = list[(at + step + list.length) % list.length];
  if (!next) return;
  zapToast(itemName("live", next));
  playLive(itemId("live", next), itemName("live", next), pn);
}

function zapToNumber(n) {
  const list = state.live || [];
  const hit = list.find(x => x.num != null && String(x.num) === String(Number(n)));
  if (!hit) return zapToast(n + "  -");
  zapToast(itemName("live", hit));
  playLive(itemId("live", hit), itemName("live", hit), pane());
}

function zapBack() {
  if (!lastChannel) return;
  const pn = pane();
  const back = lastChannel;
  zapToast(back.title || "Previous");
  playLive(back.id, back.title || "", pn);
}

function pushZapDigit(d) {
  zapBuffer += d;
  zapToast(zapBuffer);
  clearTimeout(zapTimer);
  // Long enough to type a four-digit number, short enough not to feel stuck.
  zapTimer = setTimeout(() => {
    const n = zapBuffer;
    zapBuffer = "";
    if (n) zapToNumber(n);
  }, 1300);
}

/* ---------- picture in picture ---------- */

function pipSupported() {
  return !!(document.pictureInPictureEnabled && !/iPhone|iPad/.test(navigator.userAgent));
}

async function togglePip() {
  if (!pipSupported()) return;
  try {
    if (document.pictureInPictureElement) await document.exitPictureInPicture();
    else await pane().v.requestPictureInPicture();
  } catch (e) { /* the browser refused; nothing useful to say about it */ }
}

const pipBtn = $("pipToggle");
if (pipBtn && pipSupported()) {
  pipBtn.classList.remove("hidden");
  pipBtn.onclick = togglePip;
}


/* ---------- full screen ----------

   On a phone the browser's own address bar eats the top of the picture, and in
   landscape that is a third of the screen gone. Real fullscreen is the only
   thing that removes it. The native control inside the video does this too, but
   it is small, it hides itself after a few seconds, and nobody finds it - so
   there is a plain button that says what it does.

   iPhones are the exception: Safari will not put an arbitrary element
   fullscreen, only a video, so there it asks the video directly.
*/

function inFullscreen() {
  return !!(document.fullscreenElement || document.webkitFullscreenElement);
}

function toggleFullscreen() {
  const v = pane() && pane().v;
  if (inFullscreen()) {
    if (document.exitFullscreen) document.exitFullscreen().catch(() => {});
    else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
    return;
  }
  // The whole player where the browser allows it, so the title and the channel
  // list come along; just the video where it does not.
  const host = $("player");
  const req = host.requestFullscreen || host.webkitRequestFullscreen;
  if (req && document.fullscreenEnabled !== false) {
    req.call(host).catch(() => {
      if (v && v.webkitEnterFullscreen) v.webkitEnterFullscreen();
    });
    return;
  }
  if (v && v.webkitEnterFullscreen) v.webkitEnterFullscreen();
  else if (v && v.requestFullscreen) v.requestFullscreen().catch(() => {});
}

$("fsToggle").onclick = toggleFullscreen;

/*
 * Turning the phone sideways is the moment someone wants the whole screen, and
 * it is also the moment the address bar is most in the way. A browser will not
 * let a page go fullscreen on its own - that needs a tap - so this points at
 * the button rather than pretending it can do it.
 */
(function landscapeHint() {
  let hinted = false;
  const check = () => {
    if (hinted || inFullscreen()) return;
    if ($("player").classList.contains("hidden")) return;
    const landscape = window.innerWidth > window.innerHeight;
    const phone = Math.min(window.innerWidth, window.innerHeight) < 500;
    if (!landscape || !phone) return;
    hinted = true;
    zapToast("Full screen hides the browser bar");
  };
  window.addEventListener("orientationchange", () => setTimeout(check, 400));
  window.addEventListener("resize", () => setTimeout(check, 400));
})();


/* =====================================================================
   SEND TO TV

   The website and the television app never speak to each other - they are two
   devices with no line between them. So the site acts as a letterbox: the phone
   leaves a note saying which channel it wants, and the television picks it up a
   few seconds later. The television leaves a note of its own saying what it is
   showing, which is how this page can say "your TV is on TSN" instead of
   handing somebody a dead screen on a one-connection line.

   Nothing here is a login. The latch is derived from details both halves
   already hold, so no password is ever sent to the website.
   ===================================================================== */

const CAST_URL = "jtv-cast.php";

/**
 * A short latch from the username and password.
 *
 * Not a cryptographic hash - crypto.subtle only exists on https pages and this
 * one is deliberately plain http. It does not need to be: the only thing it
 * prevents is one customer idly changing another's channel, and the worst
 * outcome it guards against is somebody else's television turning over.
 */
function castToken() {
  const seed = (state.username || "") + ":" + (state.password || "");
  // Math.imul, not a plain multiply. These products run past what a double can
  // hold exactly, so an ordinary * would round - and the television, doing the
  // same sum in a language with real 32-bit integers, would get a different
  // answer. Nothing would ever arrive and there would be nothing to see wrong.
  let a = 0x811c9dc5 | 0;
  for (let i = 0; i < seed.length; i++) {
    a = (a ^ seed.charCodeAt(i)) | 0;
    a = Math.imul(a, 0x01000193);
  }
  let c = 0x9e3779b9 | 0;
  for (let i = seed.length - 1; i >= 0; i--) {
    c = (c ^ seed.charCodeAt(i)) | 0;
    c = Math.imul(c, 0x85ebca6b | 0);
  }
  const hex = x => (x >>> 0).toString(16).padStart(8, "0");
  return hex(a) + hex(c);
}

async function castPost(fields) {
  const body = new URLSearchParams();
  body.set("user", state.username || "");
  body.set("t", castToken());
  Object.keys(fields).forEach(k => body.set(k, fields[k]));
  const r = await fetch(CAST_URL, { method: "POST", body: body, cache: "no-store" });
  return r.json();
}

async function castPeek() {
  const u = encodeURIComponent(state.username || "");
  const r = await fetch(CAST_URL + "?peek=" + u + "&t=" + castToken(), { cache: "no-store" });
  return r.json();
}

/** What the television last said it was doing, or null. */
let tvNow = null;

async function refreshTvStatus() {
  if (!state.username) return;
  try {
    const d = await castPeek();
    tvNow = (d && d.ok && d.tv && d.tv.id) ? d.tv : null;
  } catch (e) { tvNow = null; }
  renderCastButton();
}

function renderCastButton() {
  const btn = $("castToggle");
  if (!btn) return;
  // Only worth offering while a live channel is on screen.
  const on = zappable();
  btn.classList.toggle("hidden", !on);
  btn.textContent = "Send to TV";
  btn.title = tvNow
    ? "Your TV is on " + tvNow.name + " - this will change it"
    : "Put this channel on the television";
}

async function sendToTv() {
  if (!zappable()) return;
  const pn = pane();
  const name = pn.title || "";
  const btn = $("castToggle");
  btn.textContent = "Sending...";
  try {
    const d = await castPost({ action: "send", id: String(pn.channelId), name: name });
    if (d && d.ok) {
      zapToast("Sent to TV");
      btn.textContent = "Sent";
      setTimeout(renderCastButton, 2500);
    } else {
      zapToast("TV did not accept");
      setTimeout(renderCastButton, 2500);
    }
  } catch (e) {
    zapToast("Could not reach the TV");
    setTimeout(renderCastButton, 2500);
  }
}

$("castToggle").onclick = sendToTv;

// Checked when a channel opens and every half minute after, which is often
// enough to be useful and rare enough to cost nothing.
setInterval(() => { if (!$("player").classList.contains("hidden")) refreshTvStatus(); }, 30000);

/* ---------- the keys themselves ---------- */

document.addEventListener("keydown", (e) => {
  if ($("player").classList.contains("hidden")) return;
  if (e.target && /^(INPUT|TEXTAREA)$/.test(e.target.tagName)) return;
  if (e.ctrlKey || e.altKey || e.metaKey) return;

  if (e.key >= "0" && e.key <= "9" && zappable()) { e.preventDefault(); return pushZapDigit(e.key); }
  // Arrows change channel on live TV; on a film they still seek, which is what
  // anyone pressing them during a film actually wants.
  if (e.key === "ArrowUp" && zappable())   { e.preventDefault(); return zapByOffset(-1); }
  if (e.key === "ArrowDown" && zappable()) { e.preventDefault(); return zapByOffset(1); }

  // Films and episodes: the keys everyone already knows from YouTube.
  // A browser only applies these once the video element itself has keyboard
  // focus, which it almost never has, so the page does the work instead.
  const vid = pane() && pane().v;
  if (vid && !zappable()) {
    const dur = isFinite(vid.duration) ? vid.duration : null;
    const seek = (by) => {
      let t = vid.currentTime + by;
      if (t < 0) t = 0;
      if (dur !== null && t > dur - 1) t = Math.max(0, dur - 1);
      vid.currentTime = t;
      zapToast((by > 0 ? "+" : "-") + Math.abs(by) + "s");
    };
    const vol = (by) => {
      vid.muted = false;
      vid.volume = Math.min(1, Math.max(0, vid.volume + by));
      zapToast("Volume " + Math.round(vid.volume * 100) + "%");
    };
    if (e.key === "ArrowLeft")  { e.preventDefault(); return seek(-10); }
    if (e.key === "ArrowRight") { e.preventDefault(); return seek(10); }
    if (e.key === "ArrowUp")    { e.preventDefault(); return vol(0.1); }
    if (e.key === "ArrowDown")  { e.preventDefault(); return vol(-0.1); }
    // Space would also press whatever button happens to be focused.
    if (e.key === " " && !/^(BUTTON|A|SELECT)$/.test((e.target && e.target.tagName) || "")) {
      e.preventDefault();
      if (vid.paused) vid.play().catch(() => {}); else vid.pause();
      return zapToast(vid.paused ? "Paused" : "Playing");
    }
  }

  const k = (e.key || "").toLowerCase();
  if (k === "l" && zappable()) { e.preventDefault(); return zapBack(); }
  if (k === "p") { e.preventDefault(); return togglePip(); }
  if (k === "f") { e.preventDefault(); return toggleFullscreen(); }
});

document.addEventListener("keydown", (e) => {
  // In fullscreen the keys belong to the video, not to page navigation.
  if (document.fullscreenElement) return;
  if (e.key !== "Escape" && e.key !== "Backspace") return;
  // Backspace inside the search box means delete a character, not go back.
  if (e.target && /^(INPUT|TEXTAREA)$/.test(e.target.tagName)) return;
  if (!$("player").classList.contains("hidden")) { e.preventDefault(); goBackFromPlayer(); }
  else if (!$("browse").classList.contains("hidden")) { e.preventDefault(); goBackFromBrowse(); }
});

/* Date on the left of the clock, the way the app splits them. */
setInterval(() => {
  const now = new Date();
  $("homeDate").textContent =
    now.toLocaleDateString([], { weekday: "short", day: "numeric", month: "short" });
  $("clock").textContent =
    now.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
}, 1000);

/* ---------- served over https? ---------- */
/*
 * The portal is plain http, and browsers will not let an https page reach it.
 * Hosting installs a certificate whether we want one or not, so anyone who
 * types the address without "http://" can land on the https version, where
 * nothing works. Send them back once, and explain if that fails.
 */
(function httpsGuard() {
  if (location.protocol !== "https:") return;
  let tried = false;
  try { tried = sessionStorage.getItem("jtv_downgraded") === "1"; } catch (e) {}
  if (!tried) {
    try { sessionStorage.setItem("jtv_downgraded", "1"); } catch (e) {}
    location.replace("http://" + location.host + location.pathname + location.search);
    return;
  }
  document.body.innerHTML =
    '<div style="max-width:560px;margin:12vh auto;padding:0 24px;font:15px/1.5 Segoe UI,Roboto,sans-serif;color:#f2f5f8">' +
    '<h2 style="color:#ff6b6b;margin:0 0 12px">This page needs the plain address</h2>' +
    "<p>You are on the secure (https) version. The portal only accepts plain http, and " +
    "browsers refuse to mix the two, so nothing here can load.</p>" +
    '<p>Open <b style="color:#32d6a0">http://' + location.host + location.pathname + "</b> instead - " +
    "typing the <b>http://</b> part matters.</p>" +
    "<p style=\"color:#a6b2bf;font-size:13px\">If it keeps sending you back here, the hosting has an " +
    "automatic https redirect switched on and it needs turning off.</p></div>";
  document.body.style.background = "#000";
  window.__jtvHalted = true;
})();

/* ---------- start ---------- */
bindPanes();

(function start() {
  if (window.__jtvHalted) return;
  const u = store.get("username", ""), p = store.get("password", "");
  if (u && p) { $("user").value = u; $("pass").value = p; signIn(u, p, true); }
  else show("login");
})();
</script>
